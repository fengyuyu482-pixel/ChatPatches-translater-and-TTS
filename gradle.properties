# ★ chatstudy 补丁：注释掉 org.gradle.jvmargs，避免 Gradle 因为客户端 JVM 参数不匹配
# 而 fork 一个"一次性 daemon"进程 —— 那个子进程会被沙箱拦住写盘（ReadOnlyFileSystemException）。
# 内存改由外部 GRADLE_OPTS=-Xmx4G 提供。恢复原状就取消注释、删掉这行说明。
#org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
# /- should work now with Modstitch (and Stonecutter..?) 0.7+
org.gradle.configuration-cache=true

# Update Gradle wrapper with `./gradlew wrapper --gradle-version latest`

